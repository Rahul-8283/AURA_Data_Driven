[project]
name = "aura-backend"
version = "0.1.0"
description = "AURA battery materials discovery: FastAPI API, LangGraph pipeline and Celery worker"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    # Web framework and server
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    # Data validation and settings
    "pydantic==2.7.4",
    "pydantic-settings==2.3.4",
    # Environment variables
    "python-dotenv==1.0.1",
    # Databases
    "neo4j==5.21.0",
    "supabase==2.16.0",
    "psycopg2-binary==2.9.9",
    "SQLAlchemy==2.0.31",
    # AI, LLM and orchestration.
    # openai>=1.55.2 is required for compatibility with httpx>=0.28 (which dropped the
    # `proxies` kwarg older openai releases still passed internally).
    "openai==1.109.1",
    "httpx==0.28.1",
    "langgraph==1.2.12",
    # Asynchronous tasks and message broker
    "celery==5.4.0",
    "redis==5.0.7",
    # Utilities
    "requests==2.32.3",
    "pymupdf==1.28.2",
    "defusedxml==0.7.1",
    "langchain-text-splitters==1.1.2",
    "tenacity==9.1.4",
    "fastembed==0.9.0",
]

[dependency-groups]
dev = [
    "pytest==8.2.2",
    "pytest-asyncio==0.23.7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
